plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dhaksha.live'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dhaksha.live'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

