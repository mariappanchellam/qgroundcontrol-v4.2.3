# Builds this repository's QGroundControl 4.2.x as a 32-bit ARM (armeabi-v7a)
# Android APK. Mirrors upstream's v4.2.x android_32_release.yml toolchain
# (Qt 5.15.2, qmake, NDK r21, GStreamer 1.18.x) on a current Linux runner.
name: Android 32-bit

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      allow_no_video:
        description: 'Build without video streaming if GStreamer cannot be downloaded'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BASE_VERSION: v4.2.3
  ALLOW_NO_VIDEO: ${{ inputs.allow_no_video || false }}
  ANDROID_ABI: armeabi-v7a
  ARTIFACT: QGroundControl32.apk
  QT_VERSION: 5.15.2
  NDK_VERSION: 21.4.7075529
  SDK_PLATFORM: android-30
  SDK_BUILD_TOOLS: 30.0.3
  GST_VERSION: 1.18.5

jobs:
  build:
    name: Android 32-bit ARM (armeabi-v7a)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # QGCCommon.pri derives the app version from `git describe`. If the
      # base tag is missing, recreate it on the upstream import (root) commit.
      - name: Ensure version tag
        run: |
          git fetch --tags --force
          if ! git describe --tags --match 'v[0-9]*' > /dev/null 2>&1; then
            git -c user.name=ci -c user.email=ci@localhost \
              tag -a "${BASE_VERSION}" "$(git rev-list --max-parents=0 HEAD)" -m "QGroundControl ${BASE_VERSION} (upstream import)"
          fi
          git describe --tags

      # Gradle 5.5.1 bundled with Qt 5.15.2's Android template needs JDK <= 12.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK components
        run: |
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;${SDK_PLATFORM}" "build-tools;${SDK_BUILD_TOOLS}" > /dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt ${{ env.QT_VERSION }} for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android
          dir: ${{ runner.temp }}
          modules: qtcharts
          cache: true

      # jcenter() in Qt 5.15's Gradle template is no longer reliable.
      - name: Replace jcenter in Qt Android Gradle template
        run: |
          template="${QT_ROOT_DIR}/src/android/templates/build.gradle"
          sed -i 's/jcenter()/mavenCentral()/g' "$template"
          grep -n -A3 'repositories' "$template"

      # QGC 4.2.x hardcodes gstreamer-1.0-android-universal-1.18.5 at the source
      # root. 1.18.5 is no longer hosted upstream, so fall back to the closest
      # still-published release and unpack it under the expected name.
      - name: Install GStreamer for Android
        run: |
          base="https://gstreamer.freedesktop.org/data/pkg/android"
          gst_dir="gstreamer-1.0-android-universal-${GST_VERSION}"
          echo "Published GStreamer Android releases:"
          curl -fsSL -A "qgc-v4-android-build" "${base}/" | grep -o 'href="1\.[0-9.]*/"' | tr '\n' ' ' || true
          echo
          for version in "$GST_VERSION" 1.18.6 1.20.7 1.20.6 1.20.5 1.22.12 1.22.11 1.22.10; do
            tarball="gstreamer-1.0-android-universal-${version}.tar.xz"
            url="${base}/${version}/${tarball}"
            echo "Trying ${url}"
            if curl -fL --retry 3 --retry-delay 5 -A "qgc-v4-android-build" -o "$tarball" "$url"; then
              mkdir "$gst_dir"
              tar xf "$tarball" -C "$gst_dir"
              rm "$tarball"
              ls "$gst_dir"
              if [ "$version" != "$GST_VERSION" ]; then
                echo "::warning::GStreamer ${GST_VERSION} is no longer published; using ${version} instead."
              fi
              echo "GST_USED_VERSION=${version}" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          if [ "$ALLOW_NO_VIDEO" = "true" ]; then
            echo "::warning::GStreamer unavailable; building WITHOUT video streaming support."
            exit 0
          fi
          echo "::error::No usable GStreamer Android release found. Re-run with allow_no_video to build without video."
          exit 1

      - name: qmake
        run: |
          mkdir -p "${RUNNER_TEMP}/build"
          cd "${RUNNER_TEMP}/build"
          qmake -r "${GITHUB_WORKSPACE}/qgroundcontrol.pro" -spec android-clang \
            CONFIG+=StableBuild \
            ANDROID_ABIS="${ANDROID_ABI}" \
            ANDROID_SDK_BUILD_TOOLS_REVISION="${SDK_BUILD_TOOLS}"

      - name: Build
        working-directory: ${{ runner.temp }}/build
        run: make -j"$(nproc)"

      # Upstream's release keystore password is not available here, so sign
      # with a throwaway key. Uninstall any Play Store QGC before installing.
      - name: Package and sign APK
        working-directory: ${{ runner.temp }}/build
        run: |
          storepass="$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt -keystore qgc.keystore -alias qgc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=QGroundControl CI" \
            -storepass "$storepass" -keypass "$storepass"
          make apk_install_target INSTALL_ROOT=android-build
          androiddeployqt --verbose \
            --input android-QGroundControl-deployment-settings.json \
            --output android-build \
            --android-platform "${SDK_PLATFORM}" \
            --release \
            --sign qgc.keystore qgc --storepass "$storepass"
          mkdir -p package
          cp android-build/build/outputs/apk/release/android-build-release-signed.apk "package/${ARTIFACT}"
          ls -la package

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-${{ env.ANDROID_ABI }}-${{ github.sha }}
          path: ${{ runner.temp }}/build/package/${{ env.ARTIFACT }}
          if-no-files-found: error
