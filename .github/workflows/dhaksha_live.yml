# Builds Dhaksha Live, the Android viewer app for the drone video that
# DhakshaGroundControl streams to the server (tools/dhaksha/live-android).
name: Dhaksha Live

on:
  push:
    branches:
      - main
      - 'build/**'
    paths:
      - 'tools/dhaksha/live-android/**'
      - '.github/workflows/dhaksha_live.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Dhaksha Live APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # The repo's upstream VideoReceiverApp ships an old wrapper jar this app does not use
          validate-wrappers: false

      - name: Build APK
        working-directory: tools/dhaksha/live-android
        run: |
          gradle --no-daemon assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk DhakshaLive.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DhakshaLive-${{ github.sha }}
          path: tools/dhaksha/live-android/DhakshaLive.apk
          if-no-files-found: error
