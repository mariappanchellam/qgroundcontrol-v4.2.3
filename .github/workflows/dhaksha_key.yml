# Builds DhakshaKey, the Android app that writes the camera streaming script for the Dhaksha
# video server and starts it in Termux (tools/dhaksha/key-android).
name: DhakshaKey

on:
  push:
    branches:
      - main
      - 'build/**'
    paths:
      - 'tools/dhaksha/key-android/**'
      - '.github/workflows/dhaksha_key.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: DhakshaKey APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # The repo's upstream VideoReceiverApp ships an old wrapper jar this app does not use
          validate-wrappers: false

      - name: Build APK
        working-directory: tools/dhaksha/key-android
        run: |
          gradle --no-daemon assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk DhakshaKey.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DhakshaKey-${{ github.sha }}
          path: tools/dhaksha/key-android/DhakshaKey.apk
          if-no-files-found: error
